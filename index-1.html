<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ইনভয়েস অ্যাপ"/>
<meta name="theme-color" content="#FF6B00"/>
<meta name="description" content="বাংলা ব্যবসায়িক ইনভয়েস অ্যাপ"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="application-name" content="ইনভয়েস অ্যাপ"/>
<title>ইনভয়েস অ্যাপ</title>
<link rel="manifest" href="./manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hind Siliguri',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
:root{--or:#FF6B00;--or2:#ff8c38;--green:#16a34a;--red:#dc2626;--gray:#64748b;--border:#e2e8f0}
input,select,textarea{font-family:'Hind Siliguri',sans-serif;font-size:14px;color:#1e293b;outline:none;border:1.5px solid var(--border);border-radius:9px;padding:10px 13px;background:#fff;width:100%;box-sizing:border-box;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--or)}
button{font-family:'Hind Siliguri',sans-serif;cursor:pointer;border:none;border-radius:9px;font-weight:600;font-size:14px;padding:11px 18px}
button:active{opacity:.8}
.card{background:#fff;border-radius:16px;padding:18px;border:1px solid var(--border);margin-bottom:14px}
.label{font-size:11px;font-weight:700;letter-spacing:.04em;color:#94a3b8;text-transform:uppercase;margin-bottom:6px;display:block}
.badge{border-radius:99px;padding:3px 11px;font-size:11px;font-weight:700}
.badge.paid{background:#ecfdf5;color:var(--green)}
.badge.unpaid{background:#fef2f2;color:var(--red)}
.mono{font-family:'JetBrains Mono',monospace}

/* Topbar */
#topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;height:56px;gap:12px}
#topbar .logo-box{width:36px;height:36px;border-radius:9px;background:var(--or);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;overflow:hidden;flex-shrink:0}
#topbar .logo-box img{width:100%;height:100%;object-fit:contain}
#topbar .co-name{font-weight:700;font-size:15px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.view{display:none;padding:16px;max-width:680px;margin:0 auto}
.view.active{display:block}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat-card{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--border)}
.stat-label{font-size:11px;font-weight:700;color:#94a3b8;margin-bottom:6px}
.stat-val{font-size:17px;font-weight:700}

.inv-item{background:#fff;border-radius:14px;padding:14px 16px;border:1.5px solid var(--border);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:border .15s}
.inv-item:active{border-color:var(--or)}

.sec-title{font-size:13px;font-weight:700;color:var(--or);margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.total-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--gray)}
.total-final{font-size:18px;font-weight:700;border-top:2px solid var(--or);padding-top:10px;margin-top:8px;color:var(--or)}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.inv-header{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-radius:14px;padding:18px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.inv-header .logo-img{width:58px;height:58px;border-radius:10px;object-fit:contain;background:#fff;padding:5px;flex-shrink:0}
.inv-header .logo-ph{width:58px;height:58px;border-radius:10px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:360px}
th{font-size:11px;color:#94a3b8;font-weight:700;padding:8px 6px;border-bottom:2px solid #FF6B0033;text-align:left;white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid #f8fafc;font-size:13px}
td.r,th.r{text-align:right}
.empty{text-align:center;padding:60px 20px;color:#94a3b8}
.empty .icon{font-size:48px;margin-bottom:14px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.items-head{display:grid;grid-template-columns:2fr 65px 90px 28px;gap:6px;margin-bottom:6px}
.items-row{display:grid;grid-template-columns:2fr 65px 90px 28px;gap:6px;margin-bottom:8px;align-items:center}
.items-head span{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase}
.return-row{display:grid;grid-template-columns:2fr 65px 105px 28px;gap:6px;margin-bottom:8px;align-items:center}
@media print{
  #topbar,.no-print{display:none!important}
  body{background:#fff}
  .view{display:block!important;padding:0}
}
</style>
</head>
<body>

<!-- টপবার -->
<div id="topbar">
  <div class="logo-box" id="topLogoBox"><span>₹</span></div>
  <div class="co-name" id="topCoName">ইনভয়েস অ্যাপ</div>
  <div style="display:flex;gap:8px">
    <button onclick="showSetup()" style="background:#f1f5f9;color:#64748b;padding:8px 12px;font-size:12px">⚙ সেটআপ</button>
    <button id="newBtn" onclick="openNew()" style="background:var(--or);color:#fff;padding:8px 14px;font-size:13px">+ নতুন</button>
  </div>
</div>

<!-- ══ লিস্ট ভিউ ══ -->
<div class="view active" id="view-list">
  <div class="stats" id="statsGrid"></div>
  <input id="search-input" type="text" placeholder="🔍 নাম বা ইনভয়েস নম্বর খুঁজুন..." oninput="renderList()" style="margin-bottom:14px;padding:11px 16px;border-radius:12px"/>
  <div id="invList"></div>
</div>

<!-- ══ ফর্ম ভিউ ══ -->
<div class="view" id="view-form">
  <div class="inv-header" id="formHeader"></div>

  <!-- ইনভয়েস বিবরণ -->
  <div class="card">
    <div class="sec-title">📋 ইনভয়েস বিবরণ</div>
    <div class="g2" style="margin-bottom:12px">
      <div><label class="label">ইনভয়েস নং</label><input id="f-no" placeholder="INV/2026/0001"/></div>
      <div><label class="label">তারিখ</label><input id="f-date" type="date"/></div>
    </div>
  </div>

  <!-- ক্রেতার তথ্য -->
  <div class="card">
    <div class="sec-title">👤 ক্রেতার তথ্য</div>
    <div style="margin-bottom:12px">
      <label class="label">ক্রেতার নাম *</label>
      <input id="f-cname" placeholder="রাজেশ কুমার / ABC প্রাইভেট লিমিটেড"/>
    </div>
    <div>
      <label class="label">ফোন নম্বর</label>
      <input id="f-cphone" type="tel" placeholder="+91 98765 43210"/>
    </div>
  </div>

  <!-- পণ্য / সেবা -->
  <div class="card">
    <div class="sec-title">📦 পণ্য / সেবা</div>
    <div class="items-head">
      <span>বিবরণ</span><span>পরিমাণ</span><span>মূল্য (₹)</span><span></span>
    </div>
    <div id="itemsContainer"></div>
    <button onclick="addItem()" style="background:none;border:1.5px dashed #FF6B0066;color:var(--or);width:100%;margin-top:6px;padding:9px;border-radius:9px">+ আইটেম যোগ করুন</button>

    <!-- মোট -->
    <div id="formTotals" style="margin-top:16px"></div>
  </div>

  <!-- রিটার্ন মাল -->
  <div class="card" style="border-color:#fecaca">
    <div class="sec-title" style="color:var(--red)">↩ রিটার্ন মাল (ফেরত)</div>
    <div class="items-head" style="margin-bottom:6px">
      <span>বিবরণ</span><span>পরিমাণ</span><span>তারিখ</span><span></span>
    </div>
    <div id="returnContainer"></div>
    <button onclick="addReturn()" style="background:none;border:1.5px dashed #fca5a5;color:var(--red);width:100%;margin-top:6px;padding:9px;border-radius:9px">+ রিটার্ন যোগ করুন</button>
  </div>

  <!-- আগের বাকি -->
  <div class="card">
    <div class="sec-title">💰 আগের বাকি</div>
    <div class="g2">
      <div><label class="label">আগের বাকি পরিমাণ (₹)</label><input id="f-due-amt" type="number" placeholder="0.00" oninput="updateFormTotals()"/></div>
      <div><label class="label">বাকির তারিখ</label><input id="f-due-date" type="date"/></div>
    </div>
  </div>

  <div class="action-row no-print">
    <button onclick="goList()" style="background:#f1f5f9;color:#64748b">← বাতিল</button>
    <button onclick="saveInvoice()" style="background:var(--or);color:#fff">সংরক্ষণ করুন →</button>
  </div>
</div>

<!-- ══ বিস্তারিত ভিউ ══ -->
<div class="view" id="view-detail">
  <div class="inv-header" id="detailHeader"></div>
  <div id="detailContent"></div>
  <div class="action-row no-print" id="detailActions"></div>
</div>

<!-- ══ কোম্পানি সেটআপ মডাল ══ -->
<div class="modal-bg" id="setupModal" style="display:none">
  <div class="modal">
    <div style="font-size:18px;font-weight:700;margin-bottom:4px">কোম্পানি সেটআপ</div>
    <div style="font-size:12px;color:#94a3b8;margin-bottom:20px">আপনার সমস্ত ইনভয়েসে দেখাবে</div>

    <div style="text-align:center;margin-bottom:18px">
      <div id="logoPreview" onclick="document.getElementById('logoInput').click()" style="width:88px;height:88px;border-radius:14px;border:2px dashed #cbd5e1;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0 auto 8px;overflow:hidden;background:#f8fafc;font-size:30px">🏢</div>
      <div style="font-size:12px;color:#94a3b8;cursor:pointer" onclick="document.getElementById('logoInput').click()">লোগো আপলোড করুন</div>
      <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="handleLogo(this)"/>
    </div>

    <div class="g2" style="margin-bottom:12px">
      <div><label class="label">কোম্পানির নাম *</label><input id="s-name" placeholder="আপনার ব্যবসার নাম"/></div>
      <div><label class="label">ফোন</label><input id="s-phone" placeholder="+91 98765 43210"/></div>
    </div>
    <div style="margin-bottom:18px">
      <label class="label">ঠিকানা</label>
      <textarea id="s-addr" rows="2" placeholder="দোকান নং, রাস্তা, শহর, রাজ্য"></textarea>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closeSetup()" style="background:#f1f5f9;color:#64748b" id="cancelSetupBtn">বাতিল</button>
      <button onclick="saveSetup()" style="background:var(--or);color:#fff">সংরক্ষণ করুন →</button>
    </div>
  </div>
</div>



<!-- ══ DUE LIST MODAL ══ -->
<div class="modal-bg" id="dueModal" style="display:none">
  <div class="modal" style="max-width:480px;padding:20px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:18px;font-weight:700">💰 বকেয়া তালিকা</div>
      <button onclick="closeDueModal()" style="background:#f1f5f9;color:#64748b;padding:6px 12px;font-size:13px">✕</button>
    </div>
    <div id="dueListContent"></div>
  </div>
</div>

<!-- ══ SEND MODAL ══ -->
<div class="modal-bg" id="sendModal" style="display:none">
  <div class="modal" style="max-width:340px;text-align:center">
    <div style="font-size:20px;margin-bottom:6px">📤 পাঠাবেন?</div>
    <div style="font-size:13px;color:#64748b;margin-bottom:22px" id="sendModalName"></div>
    <div style="display:flex;gap:12px;justify-content:center;margin-bottom:16px">
      <button id="smsSendBtn" style="background:#1e90ff;color:#fff;padding:13px 22px;font-size:15px;border-radius:12px;flex:1">
        📱 SMS
      </button>
      <button id="waSendBtn" style="background:#25D366;color:#fff;padding:13px 22px;font-size:15px;border-radius:12px;flex:1">
        💬 WhatsApp
      </button>
    </div>
    <button onclick="closeSendModal()" style="background:#f1f5f9;color:#64748b;width:100%;padding:11px">
      বাদ দিন
    </button>
  </div>
</div>

<script>
// ══ STATE ══
let company = JSON.parse(localStorage.getItem('bn_co')||'{"name":"","address":"","phone":"","logo":null}');
let invoices = JSON.parse(localStorage.getItem('bn_invs')||'[]');
let editId = null;
let items = [];
let returnItems = [];

// ══ UTILS ══
function save(){
  localStorage.setItem('bn_co',JSON.stringify(company));
  localStorage.setItem('bn_invs',JSON.stringify(invoices));
}
function fmtINR(n){
  return '₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function genNo(){
  const y=new Date().getFullYear();
  return `INV/${y}/${String(invoices.length+1).padStart(4,'0')}`;
}
function todayStr(){return new Date().toISOString().split('T')[0]}

const ones=["","এক","দুই","তিন","চার","পাঁচ","ছয়","সাত","আট","নয়","দশ","এগারো","বারো","তেরো","চোদ্দ","পনেরো","ষোলো","সতেরো","আঠারো","উনিশ","বিশ"];
const tens_b=["","","বিশ","ত্রিশ","চল্লিশ","পঞ্চাশ","ষাট","সত্তর","আশি","নব্বই"];
function n2bn(n){
  n=Math.round(n);
  if(n===0)return"শূন্য";
  let w="";
  if(n>=10000000){w+=n2bn(Math.floor(n/10000000))+" কোটি ";n%=10000000;}
  if(n>=100000){w+=n2bn(Math.floor(n/100000))+" লক্ষ ";n%=100000;}
  if(n>=1000){w+=n2bn(Math.floor(n/1000))+" হাজার ";n%=1000;}
  if(n>=100){w+=n2bn(Math.floor(n/100))+" শত ";n%=100;}
  if(n>0){
    if(n<=20)w+=ones[n];
    else w+=tens_b[Math.floor(n/10)]+(n%10?" "+ones[n%10]:"");
  }
  return w.trim();
}

function calcTotal(itms){
  return itms.reduce((s,i)=>s+(+i.qty||0)*(+i.rate||0),0);
}

// ══ TOPBAR ══
function updateTopBar(){
  const box=document.getElementById('topLogoBox');
  document.getElementById('topCoName').textContent=company.name||'ইনভয়েস অ্যাপ';
  box.innerHTML=company.logo?`<img src="${company.logo}" style="width:100%;height:100%;object-fit:contain;border-radius:9px"/>`:`<span>₹</span>`;
}

// ══ VIEWS ══
function showView(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  document.getElementById('newBtn').style.display=id==='list'?'block':'none';
  window.scrollTo(0,0);
}
function goList(){showView('list');renderList();}

// ══ SETUP ══
function showSetup(){
  document.getElementById('s-name').value=company.name||'';
  document.getElementById('s-phone').value=company.phone||'';
  document.getElementById('s-addr').value=company.address||'';
  const prev=document.getElementById('logoPreview');
  prev.innerHTML=company.logo?`<img src="${company.logo}" style="width:100%;height:100%;object-fit:contain"/>`:'🏢';
  document.getElementById('cancelSetupBtn').style.display=company.name?'block':'none';
  document.getElementById('setupModal').style.display='flex';
}
function closeSetup(){document.getElementById('setupModal').style.display='none';}
function handleLogo(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    company.logo=e.target.result;
    document.getElementById('logoPreview').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:contain"/>`;
  };
  r.readAsDataURL(file);
}
function saveSetup(){
  const name=document.getElementById('s-name').value.trim();
  if(!name){alert('কোম্পানির নাম দিন!');return;}
  company.name=name;
  company.phone=document.getElementById('s-phone').value.trim();
  company.address=document.getElementById('s-addr').value.trim();
  save();updateTopBar();closeSetup();
}

// ══ HEADER HTML ══
function headerHTML(){
  const logo=company.logo?`<img src="${company.logo}" class="logo-img"/>`:`<div class="logo-ph">🏢</div>`;
  return `${logo}<div style="flex:1">
    <div style="font-size:19px;font-weight:700">${company.name||'আপনার কোম্পানি'}</div>
    <div style="font-size:11px;opacity:.85;margin-top:3px">${company.address||''}</div>
    ${company.phone?`<div style="font-size:11px;opacity:.85">📞 ${company.phone}</div>`:''}
  </div>`;
}

// ══ FORM ══
function openNew(){
  if(!company.name){alert('প্রথমে কোম্পানি সেটআপ করুন!');showSetup();return;}
  editId=null;
  items=[{desc:'',qty:'',rate:''}];
  document.getElementById('f-no').value=genNo();
  document.getElementById('f-date').value=todayStr();
  document.getElementById('f-cname').value='';
  document.getElementById('f-cphone').value='';
  document.getElementById('f-due-amt').value='';
  document.getElementById('f-due-date').value='';
  returnItems=[];
  document.getElementById('formHeader').innerHTML=headerHTML();
  renderItems();renderReturn();updateFormTotals();
  showView('form');
}

function openEdit(id){
  const inv=invoices.find(i=>i.id===id);if(!inv)return;
  editId=id;
  items=inv.items.map(i=>({...i}));
  document.getElementById('f-no').value=inv.no;
  document.getElementById('f-date').value=inv.date;
  document.getElementById('f-cname').value=inv.cname;
  document.getElementById('f-cphone').value=inv.cphone||'';
  document.getElementById('f-due-amt').value=inv.prevDue||'';
  document.getElementById('f-due-date').value=inv.dueDate||'';
  returnItems=(inv.returnItems||[]).map(r=>({...r}));
  document.getElementById('formHeader').innerHTML=headerHTML();
  renderItems();renderReturn();updateFormTotals();
  showView('form');
}

function renderItems(){
  document.getElementById('itemsContainer').innerHTML=items.map((it,i)=>`
    <div class="items-row">
      <input value="${it.desc}" oninput="items[${i}].desc=this.value" placeholder="পণ্য/সেবার নাম"/>
      <input type="number" value="${it.qty}" oninput="items[${i}].qty=this.value;updateFormTotals()" placeholder="১" style="text-align:center"/>
      <input type="number" value="${it.rate}" oninput="items[${i}].rate=this.value;updateFormTotals()" placeholder="০.০০"/>
      <button onclick="removeItem(${i})" style="background:#fef2f2;color:var(--red);padding:0;font-size:16px;width:28px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center" ${items.length===1?'disabled':''}>×</button>
    </div>`).join('');
}

function addItem(){
  items.push({desc:'',qty:'',rate:''});
  renderItems();updateFormTotals();
}
function removeItem(i){
  if(items.length===1)return;
  items.splice(i,1);renderItems();updateFormTotals();
}

function renderReturn(){
  const c=document.getElementById('returnContainer');
  if(!c)return;
  if(returnItems.length===0){c.innerHTML='';return;}
  c.innerHTML=returnItems.map((r,i)=>`
    <div class="return-row">
      <input value="${r.desc}" oninput="returnItems[${i}].desc=this.value" placeholder="পণ্যের নাম" style="border-color:#fca5a5"/>
      <input type="number" value="${r.qty}" oninput="returnItems[${i}].qty=this.value;updateFormTotals()" placeholder="১" style="text-align:center;border-color:#fca5a5"/>
      <input type="date" value="${r.date||''}" oninput="returnItems[${i}].date=this.value" style="border-color:#fca5a5;font-size:12px;padding:8px 6px"/>
      <button onclick="removeReturn(${i})" style="background:#fef2f2;color:var(--red);padding:0;font-size:16px;width:28px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center">×</button>
    </div>`).join('');
}
function addReturn(){
  returnItems.push({desc:'',qty:'',date:''});
  renderReturn();updateFormTotals();
}
function removeReturn(i){
  returnItems.splice(i,1);renderReturn();updateFormTotals();
}

function calcReturnTotal(ritms){
  return ritms.reduce((s,r)=>(+r.qty||0)>0?s+(+r.qty||0):s,0);
}
function updateFormTotals(){
  const sub=calcTotal(items);
  const retQty=returnItems.reduce((s,r)=>(+r.qty||0)>0?s+(+r.qty||0):s,0);
  // Return deduction: sum of (qty * matched item rate) or just qty count display
  const retAmt=returnItems.reduce((s,r)=>{
    const qty=+r.qty||0;
    // find matching item rate by desc
    const match=items.find(it=>it.desc&&r.desc&&it.desc.trim().toLowerCase()===r.desc.trim().toLowerCase());
    const rate=match?+match.rate||0:0;
    return s+qty*rate;
  },0);
  const prevDue=parseFloat(document.getElementById('f-due-amt').value)||0;
  const net=sub-retAmt+prevDue;
  document.getElementById('formTotals').innerHTML=`
    <div class="total-row"><span>বিক্রয় মোট</span><span class="mono">${fmtINR(sub)}</span></div>
    ${retAmt>0?`<div class="total-row"><span>রিটার্ন বাদ</span><span class="mono" style="color:var(--red)">- ${fmtINR(retAmt)}</span></div>`:''}
    ${prevDue>0?`<div class="total-row"><span>আগের বাকি যোগ</span><span class="mono" style="color:var(--or)">+ ${fmtINR(prevDue)}</span></div>`:''}
    <div class="total-row total-final"><span>সর্বমোট প্রদেয়</span><span class="mono">${fmtINR(net)}</span></div>
    <div style="font-size:11.5px;color:#94a3b8;font-style:italic;margin-top:5px">${n2bn(Math.round(net>0?net:0))} টাকা মাত্র</div>`;
}

function saveInvoice(){
  const cname=document.getElementById('f-cname').value.trim();
  if(!cname){alert('ক্রেতার নাম দিন!');return;}
  const sub=calcTotal(items);
  const prevDue=parseFloat(document.getElementById('f-due-amt').value)||0;
  const retAmt=returnItems.reduce((s,r)=>{
    const qty=+r.qty||0;
    const match=items.find(it=>it.desc&&r.desc&&it.desc.trim().toLowerCase()===r.desc.trim().toLowerCase());
    const rate=match?+match.rate||0:0;
    return s+qty*rate;
  },0);
  const net=sub-retAmt+prevDue;
  const inv={
    id:editId||Math.random().toString(36).slice(2),
    no:document.getElementById('f-no').value.trim()||genNo(),
    date:document.getElementById('f-date').value,
    cname,cphone:document.getElementById('f-cphone').value.trim(),
    items:items.map(i=>({...i})),
    returnItems:returnItems.map(r=>({...r})),
    retAmt,prevDue,dueDate:document.getElementById('f-due-date').value,
    total:sub,net:net>0?net:0,
    status:editId?(invoices.find(i=>i.id===editId)||{}).status||'unpaid':'unpaid'
  };
  if(editId){const idx=invoices.findIndex(i=>i.id===editId);if(idx>-1)invoices[idx]=inv;}
  else invoices.unshift(inv);
  save();

  // SEND OPTION POPUP
  if(inv.cphone){
    showSendModal(inv);
  }

  goList();
}

// ══ LIST ══
function renderList(){
  const q=(document.getElementById('search-input').value||'').toLowerCase();
  const filtered=invoices.filter(i=>i.cname.toLowerCase().includes(q)||i.no.toLowerCase().includes(q)||i.date.includes(q));
  const totalRev=invoices.reduce((s,i)=>s+i.total,0);
  const paid=invoices.filter(i=>i.status==='paid').reduce((s,i)=>s+i.net,0);
  const due = totalRev-paid;
  // এই মাস ও আগের মাসের বিক্রয়
  const now = new Date();
  const monthNames = ['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];
  const thisMonth = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const prevDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
  const prevMonth = prevDate.getFullYear()+'-'+String(prevDate.getMonth()+1).padStart(2,'0');
  const monthRev = invoices.filter(i=>i.date&&i.date.startsWith(thisMonth)).reduce((s,i)=>s+i.total,0);
  const prevRev  = invoices.filter(i=>i.date&&i.date.startsWith(prevMonth)).reduce((s,i)=>s+i.total,0);
  const mnLabel  = monthNames[now.getMonth()];
  const prLabel  = monthNames[prevDate.getMonth()];
  const diff = monthRev - prevRev;
  const diffColor = diff>=0?'var(--green)':'var(--red)';
  const diffIcon  = diff>0?'▲':diff<0?'▼':'—';
  const diffText  = diff!==0?(diffIcon+' '+fmtINR(Math.abs(diff))):'— কোনো পরিবর্তন নেই';

  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card"><div class="stat-label">মোট ইনভয়েস</div><div class="stat-val">${invoices.length}টি</div></div>
    <div class="stat-card" style="border:1.5px solid #fed7aa;grid-column:span 1">
      <div class="stat-label">📅 ${mnLabel} মাস বিক্রয়</div>
      <div class="stat-val mono" style="font-size:15px;color:var(--or)">${fmtINR(monthRev)}</div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px dashed #e2e8f0">
        <div style="font-size:10px;color:#94a3b8">${prLabel}: <span style="font-weight:700;color:#64748b">${fmtINR(prevRev)}</span></div>
        <div style="font-size:10px;font-weight:700;color:${diffColor}">${diffText}</div>
      </div>
    </div>
    <div class="stat-card"><div class="stat-label">আদায় হয়েছে</div><div class="stat-val mono" style="color:var(--green);font-size:15px">${fmtINR(paid)}</div></div>
    <div class="stat-card" onclick="showDueList()" style="cursor:pointer;border:1.5px solid ${due>0?'#fecaca':'var(--border)'};background:${due>0?'#fff5f5':'#fff'}">
      <div class="stat-label" style="color:${due>0?'var(--red)':'#94a3b8'}">💰 বকেয়া ${due>0?'👆':''}</div>
      <div class="stat-val mono" style="color:${due>0?'var(--red)':'var(--green)'};font-size:15px">${fmtINR(due)}</div>
    </div>`;

  if(filtered.length===0){
    document.getElementById('invList').innerHTML=`<div class="empty"><div class="icon">🧾</div><div style="font-size:16px;font-weight:600;color:var(--gray);margin-bottom:6px">${invoices.length===0?'কোনো ইনভয়েস নেই':'কিছু পাওয়া যায়নি'}</div><p>${invoices.length===0?'"+ নতুন" বাটনে চাপ দিয়ে ইনভয়েস তৈরি করুন':''}</p></div>`;
    return;
  }
  document.getElementById('invList').innerHTML=filtered.map(inv=>`
    <div class="inv-item" onclick="openDetail('${inv.id}')" style="border-color:${inv.status==='paid'?'#e2e8f0':'#fecaca'}">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
          <span class="mono" style="font-size:12px;color:#94a3b8">${inv.no}</span>
          ${inv.status!=='paid'?'<span class="badge unpaid">বকেয়া</span>':'<span class="badge paid">পরিশোধিত</span>'}
          <span style="font-size:11px;color:#94a3b8">${inv.date}</span>
        </div>
        <div style="font-weight:700;font-size:15px">${inv.cname}</div>
        ${inv.cphone?`<div style="font-size:12px;color:#94a3b8;margin-top:2px">📞 ${inv.cphone}</div>`:''}
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="mono" style="font-size:17px;font-weight:700;color:${inv.status==='paid'?'var(--green)':'var(--red)'}">${fmtINR(inv.net)}</div>
        <div style="font-size:11px;color:#94a3b8;margin-top:2px">${inv.items.length}টি আইটেম</div>
      </div>
    </div>`).join('');

// ══ WHATSAPP SHARE ══
function shareWhatsApp(id){
  const inv = invoices.find(i=>i.id===id);
  if(!inv || !inv.cphone) return;

  const items = inv.items.map(it=>{
    const amt = (+it.qty||0)*(+it.rate||0);
    return `• ${it.desc||'—'} × ${it.qty} = ₹${amt.toFixed(2)}`;
  }).join('\n');

  const co = company.name||'ব্যবসা';
  const status = inv.status==='paid'?'✅ পরিশোধিত':'❌ এখনো বাকি';
  let msg = `🧾 *ইনভয়েস: ${inv.no}*\n━━━━━━━━━━━━\n🏢 *${co}*\n👤 প্রিয় *${inv.cname}*,\n\n📦 *পণ্য:*\n${items}\n━━━━━━━━━━━━\n✅ *সর্বমোট: ₹${inv.net.toFixed(2)}*\n📅 ${inv.date}\n${status}\n\nধন্যবাদ! 🙏`;

  let phone = inv.cphone.replace(/\D/g,'');
  if(phone.length===10) phone = '91'+phone;
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');
}

    document.getElementById('dueListContent').innerHTML='<div class="empty"><div class="icon">🎉</div><div style="font-weight:600;color:var(--green)">কোনো বকেয়া নেই!</div></div>';
  } else {
    document.getElementById('dueListContent').innerHTML = unpaid.map(inv=>`
      <div id="dueitem-${inv.id}" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;border:1.5px solid #fecaca;margin-bottom:10px;background:#fff5f5;transition:all .3s">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
            <span style="font-weight:700;font-size:15px">${inv.cname}</span>
            <span class="badge unpaid" style="font-size:10px">বকেয়া</span>
          </div>
          <div style="font-size:12px;color:#94a3b8">${inv.no} • ${inv.date}</div>
          ${inv.cphone?`<div style="font-size:12px;color:#64748b">📞 ${inv.cphone}</div>`:''}
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:10px">
          <div style="font-size:17px;font-weight:700;color:var(--red)">${fmtINR(inv.net)}</div>
          <button onclick="markPaidFromDue('${inv.id}')" style="background:#ecfdf5;color:var(--green);padding:5px 10px;font-size:11px;margin-top:5px;border-radius:8px">✓ পরিশোধিত</button>
        </div>
      </div>`).join('');
  }
  document.getElementById('dueModal').style.display='flex';
}

function markPaidFromDue(id){
  invoices = invoices.map(i=>i.id===id?{...i,status:'paid'}:i);
  save();
  // Animate green
  const el = document.getElementById('dueitem-'+id);
  if(el){
    el.style.background='#ecfdf5';
    el.style.borderColor='#86efac';
    el.innerHTML=`<div style="flex:1"><div style="font-weight:700;color:var(--green)">✅ পরিশোধিত!</div></div>`;
    setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(), 400); }, 1000);
  }
  renderList();
}

function closeDueModal(){
  document.getElementById('dueModal').style.display='none';
}

// ══ SEND MODAL ══
function showSendModal(inv){
  const itemLines=inv.items.map(it=>{
    const amt=(+it.qty||0)*(+it.rate||0);
    return (it.desc||'-')+' x'+it.qty+' = Rs.'+amt.toFixed(2);
  }).join(', ');
  const co=company.name||'আপনার ব্যবসা';
  const dueInfo=inv.dueDate?' | বাকির তারিখ: '+inv.dueDate:'';
  const prevInfo=inv.prevDue>0?' | আগের বাকি: Rs.'+inv.prevDue.toFixed(2):'';
  const smsMsg=co+' | ইনভয়েস: '+inv.no+' | '+inv.cname+' | '+itemLines+prevInfo+' | মোট: Rs.'+inv.net.toFixed(2)+' | তারিখ: '+inv.date+dueInfo+' | ধন্যবাদ!';
  const waMsg='🧾 *ইনভয়েস: '+inv.no+'*\n━━━━━━━━━━━━\n🏢 *'+co+'*\n👤 প্রিয় *'+inv.cname+'*,\n\n📦 *পণ্য:*\n'+itemLines+prevInfo+'\n━━━━━━━━━━━━\n✅ *মোট: Rs.'+inv.net.toFixed(2)+'*\n📅 '+inv.date+dueInfo+'\n\nধন্যবাদ! 🙏';
  let phone=inv.cphone.replace(/\D/g,'');
  if(phone.length===10) phone='91'+phone;

  document.getElementById('sendModalName').textContent=inv.cname+' — '+inv.cphone;
  document.getElementById('smsSendBtn').onclick=function(){
    window.location.href='sms:'+phone+'?body='+encodeURIComponent(smsMsg);
    closeSendModal();
  };
  document.getElementById('waSendBtn').onclick=function(){
    window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(waMsg),'_blank');
    closeSendModal();
  };
  document.getElementById('sendModal').style.display='flex';
}
function closeSendModal(){
  document.getElementById('sendModal').style.display='none';
}

// ══ INIT ══
updateTopBar();
renderList();
if(!company.name) showSetup();

// ══ SERVICE WORKER ══
if('serviceWorker' in navigator){
  // Inline service worker via data URL won't work for scope
  // Instead register sw.js if available, silently skip if not
  navigator.serviceWorker.register('./sw.js', {scope:'./'}).then(function(reg){
    console.log('SW registered:', reg.scope);
  }).catch(function(e){
    console.log('SW not available (run from server):', e.message);
  });
}
</script>
